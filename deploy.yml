apiVersion: apps/v1
kind: Deployment
metadata:
  name: ib-bank
  labels:
    app: bank
spec:
  replicas: 5
  selector:
    matchLabels:
      app: bank
  template:
    metadata:
      labels:
        app: bank
    spec:
      containers:
        - name: cont-1
          image: charanvardhan/pallavi:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ib-service
spec:
  type: LoadBalancer
  selector:
    app: bank
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31122
